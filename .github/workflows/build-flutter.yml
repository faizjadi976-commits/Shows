name: build-apk
run-name: build-${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id dari bot"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jobs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev automake
          pip install buildozer "cython<3" virtualenv setuptools
      - name: Unpack project
        run: |
          mkdir app
          unzip -q "jobs/${{ inputs.job_id }}.zip" -d app
      - name: Build debug APK
        working-directory: app
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id }}
          path: app/bin/*.apk
          retention-days: 1
