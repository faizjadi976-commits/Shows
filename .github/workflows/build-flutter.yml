name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID unik dari bot'
        required: true
      userId:
        description: 'User ID (opsional, dari bot)'
        required: false
      payload:
        description: 'JSON payload (mode, url, buildType, tag)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Parse payload dari bot
        id: parse
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # payload lewat env (bukan di-echo inline) -> aman dari karakter ' " $ di JSON
          printf '%s' "$PAYLOAD" > payload.json
          MODE=$(jq -r '.mode' payload.json)
          URL=$(jq -r '.url' payload.json)
          BUILD_TYPE=$(jq -r '.buildType // "release"' payload.json)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

          # ── Konfigurasi Gemini AI (dari bot: /setgemini, /gmodel, dst.) ──
          # Prioritas API key: payload dari bot -> secret repo GEMINI_API_KEY
          KEY=$(jq -r '.gemini.key // empty' payload.json)
          if [ -z "$KEY" ]; then KEY="$SECRET_GEMINI_KEY"; fi
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "GEMINI_API_KEY=$KEY" >> "$GITHUB_ENV"
          fi
          ENABLED=$(jq -r 'if .gemini.enabled == false then "false" else "true" end' payload.json)
          if [ -z "$KEY" ]; then ENABLED=false; fi
          MAXFIX=$(jq -r '(.gemini.maxFix // 6) | if . > 10 then 10 elif . < 0 then 0 else . end' payload.json)
          {
            echo "GEMINI_ENABLED=$ENABLED"
            echo "GEMINI_MODEL=$(jq -r '.gemini.model // "gemini-3.7-flash"' payload.json)"
            echo "GEMINI_FALLBACKS=$(jq -r '(.gemini.fallbacks // []) | join(",")' payload.json)"
            echo "MAX_FIX=$MAXFIX"
          } >> "$GITHUB_ENV"
          echo "🤖 Gemini auto-fix: $ENABLED (model: $(jq -r '.gemini.model // "gemini-3.7-flash"' payload.json), maks $MAXFIX percobaan)"
          rm -f payload.json

      - name: Pasang helper auto-fix (Gemini)
        run: |
          cat > /tmp/gemini_fix.py << 'PYEOF'
          #!/usr/bin/env python3
          """Auto-fix error build Flutter/Android (rule-based dulu, lalu Gemini).

          Dipanggil dari workflow GitHub Actions:  python3 gemini_fix.py <log> <percobaan>
          Dijalankan dari folder root project Flutter.
          Exit code: 0 = ada perbaikan yang diterapkan (build boleh diulang)
                     1 = tidak ada perbaikan baru (build dihentikan)
          """
          import glob
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          LOG = sys.argv[1]
          ATTEMPT = int(sys.argv[2]) if len(sys.argv) > 2 else 1
          ROOT = os.path.realpath(os.getcwd())
          STATE = "/tmp/fix_state.json"
          BASE = os.environ.get("GEMINI_BASE", "https://generativelanguage.googleapis.com/v1beta")
          KEY = os.environ.get("GEMINI_API_KEY", "")
          ENABLED = os.environ.get("GEMINI_ENABLED", "false") == "true" and bool(KEY)
          MODEL = os.environ.get("GEMINI_MODEL") or "gemini-3.7-flash"
          FALLBACKS = [m.strip() for m in os.environ.get("GEMINI_FALLBACKS", "").split(",") if m.strip()]
          ALLOWED_EXT = (".dart", ".yaml", ".yml", ".gradle", ".kts", ".properties", ".xml", ".kt", ".java")
          BLOCKED_PARTS = ("/build/", "/.dart_tool/", "/.git/", "/.pub-cache/")
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")
          PUB_CACHE = os.environ.get("PUB_CACHE") or os.path.expanduser("~/.pub-cache")


          def say(msg):
              print(msg, flush=True)


          def summary(md):
              if SUMMARY:
                  try:
                      with open(SUMMARY, "a", encoding="utf-8") as f:
                          f.write(md + "\n")
                  except OSError:
                      pass


          def load_state():
              try:
                  with open(STATE, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {"rules": [], "history": [], "hashes": []}


          def save_state(st):
              with open(STATE, "w", encoding="utf-8") as f:
                  json.dump(st, f)


          def read(path):
              with open(path, encoding="utf-8", errors="replace") as f:
                  return f.read()


          def write(path, text):
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)


          def mark_pub_get():
              open("/tmp/need_pub_get", "w").close()


          # ─── 1. PERBAIKAN BERBASIS ATURAN (cepat, tanpa AI) ─────────────────────────
          def gradle_app_files():
              return glob.glob("android/app/build.gradle") + glob.glob("android/app/build.gradle.kts")


          def rule_fixes(log, st):
              done = []

              # compileSdk: hanya kalau AGP benar-benar gagal ("compile against version N")
              req = [int(x) for x in re.findall(r"compile against version (\d+)", log)]
              if req:
                  n = max(req)
                  key = f"compileSdk{n}"
                  if key not in st["rules"]:
                      for p in gradle_app_files():
                          src = read(p)

                          def bump(m):
                              cur = re.search(r"\d+", m.group(2))
                              if cur and int(cur.group(0)) >= n:
                                  return m.group(0)
                              return f"{m.group(1)}{n}"

                          out = re.sub(
                              r"(compileSdk(?:Version)?\s*=?\s*)(flutter\.compileSdk(?:Version)?|\d+)", bump, src
                          )
                          if out != src:
                              write(p, out)
                              done.append(f"compileSdk -> {n} di {p}")
                      st["rules"].append(key)

              # minSdk: "minSdkVersion X cannot be smaller than version Y"
              mm = re.findall(r"minSdkVersion (\d+) cannot be smaller than version (\d+)", log)
              if mm:
                  n = max(int(b) for _, b in mm)
                  key = f"minSdk{n}"
                  if key not in st["rules"]:
                      for p in gradle_app_files():
                          src = read(p)
                          out = re.sub(
                              r"(minSdk(?:Version)?\s*=?\s*)(?:flutter\.minSdk(?:Version)?|\d+)",
                              lambda m: f"{m.group(1)}{n}",
                              src,
                          )
                          if out != src:
                              write(p, out)
                              done.append(f"minSdk -> {n} di {p}")
                      st["rules"].append(key)
              return done


          # ─── 2. KONTEKS UNTUK AI ────────────────────────────────────────────────────
          def clean_log(log):
              return re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", log)


          def err_excerpt(log):
              lines = log.splitlines()
              pat = re.compile(
                  r"error|FAILURE|What went wrong|Could not|requires|Unresolved|Execution failed|Caused by|"
                  r"Duplicate class|incompatible|cannot be smaller|not found|Context:|Exception|solving failed|"
                  r"version solving|Because |e: ",
                  re.I,
              )
              keep = set()
              for i, line in enumerate(lines):
                  if pat.search(line):
                      for j in range(max(0, i - 1), min(len(lines), i + 3)):
                          keep.add(j)
              seen, out = set(), []
              for i in sorted(keep):
                  s = lines[i].rstrip()
                  if s and s not in seen:
                      seen.add(s)
                      out.append(s)
              body = "\n".join(out)[-14000:]
              tail = "\n".join(lines[-40:])
              return body + "\n--- 40 BARIS TERAKHIR ---\n" + tail


          def numbered(lines, start=1):
              return "\n".join(f"{i + start:>4}| {l}" for i, l in enumerate(lines))


          def window(path, hit_lines, radius=30, whole_limit=200):
              src = read(path).splitlines()
              if len(src) <= whole_limit or not hit_lines:
                  return numbered(src[:whole_limit] if len(src) > whole_limit else src)
              spans = []
              for h in sorted(set(hit_lines)):
                  a, b = max(1, h - radius), min(len(src), h + radius)
                  if spans and a <= spans[-1][1] + 5:
                      spans[-1][1] = max(spans[-1][1], b)
                  else:
                      spans.append([a, b])
              parts = [numbered(src[a - 1 : b], a) for a, b in spans[:5]]
              return "\n   ...\n".join(parts)


          def collect_context(log):
              hits = {}
              pat = (
                  r"((?:lib|test|android|ios)/[\w./\-]+?\.(?:dart|gradle|kts|properties|xml|kt|java))"
                  r"(?::(\d+))?"
              )
              for m in re.finditer(pat, log):
                  p = m.group(1)
                  if os.path.isfile(p):
                      hits.setdefault(p, set())
                      if m.group(2):
                          hits[p].add(int(m.group(2)))

              ctx = []
              for p, ls in list(hits.items())[:8]:
                  ctx.append(f"### FILE PROJECT: {p}\n{window(p, ls)}")

              # Config yang hampir selalu relevan
              for p in [
                  "pubspec.yaml",
                  "android/app/build.gradle",
                  "android/app/build.gradle.kts",
                  "android/build.gradle",
                  "android/build.gradle.kts",
                  "android/settings.gradle",
                  "android/settings.gradle.kts",
                  "android/gradle.properties",
                  "android/gradle/wrapper/gradle-wrapper.properties",
                  "android/app/src/main/AndroidManifest.xml",
              ]:
                  if os.path.isfile(p) and p not in hits:
                      ctx.append(f"### FILE CONFIG: {p}\n{window(p, [], whole_limit=150)}")

              # Sumber package di pub-cache (supaya AI melihat signature API yang SEBENARNYA)
              seen = set()
              for m in re.finditer(r"\.pub-cache/(hosted/[^\s:]+?\.dart):(\d+)", log):
                  rel, ln = m.group(1), int(m.group(2))
                  full = os.path.join(PUB_CACHE, rel)
                  if full in seen or not os.path.isfile(full) or len(seen) >= 3:
                      continue
                  seen.add(full)
                  ctx.append(
                      f"### SUMBER PACKAGE (read-only, JANGAN diedit): {rel}\n{window(full, [ln], radius=14, whole_limit=0)}"
                  )
              return "\n\n".join(ctx)[:60000]


          SYSTEM = (
              "Kamu adalah insinyur senior build Flutter & Android (Gradle/AGP/Kotlin/Dart). "
              "Tugasmu: menganalisis log error build dan memberi perbaikan MINIMAL agar build APK lolos, "
              "dengan mengubah file project (bukan package di pub-cache). "
              "Jawab HANYA JSON valid tanpa markdown dengan bentuk:\n"
              '{"analysis":"penyebab & rencana dalam 1-3 kalimat Bahasa Indonesia",'
              '"fixes":[{"path":"relatif dari root project","action":"replace","find":"teks persis dari file",'
              '"replace":"teks pengganti","all":false,"why":"alasan singkat"}]}\n'
              "Aturan:\n"
              "- action hanya 'replace' (find harus SALAH-SATU potongan teks yang PERSIS ada di file, tanpa nomor baris "
              "'NNN| ' di depan, dan unik kecuali all=true) atau 'write' (isi lengkap file di field 'content', hanya untuk file kecil/baru).\n"
              "- Sesuaikan KODE aplikasi dengan API package versi yang terpasang (lihat sumber package kalau ada). "
              "Mis. parameter yang sudah dihapus -> hapus argumennya; method dipindah -> pakai yang baru.\n"
              "- Boleh mengubah pubspec.yaml (mis. pin versi package) HANYA kalau perbaikan kode tidak memungkinkan.\n"
              "- Boleh mengubah file gradle/kts/properties/AndroidManifest bila errornya dari sana.\n"
              "- Jangan menyentuh file generated (*.g.dart), folder build/, .dart_tool/, atau pubspec.lock.\n"
              "- Jangan mengulang perbaikan yang sudah tercatat gagal di riwayat. Kalau tidak yakin, beri fixes kosong dan jelaskan di analysis.\n"
              "- Perbaiki SEMUA error yang terlihat di log sekaligus, bukan satu-satu."
          )


          def gemini(prompt):
              chain = []
              for m in [MODEL] + FALLBACKS:
                  if m and m not in chain:
                      chain.append(m)
              last = None
              for m in chain:
                  for attempt in range(2):
                      body = json.dumps(
                          {
                              "systemInstruction": {"parts": [{"text": SYSTEM}]},
                              "contents": [{"role": "user", "parts": [{"text": prompt}]}],
                              "generationConfig": {
                                  "temperature": 0.2,
                                  "maxOutputTokens": 16384,
                                  "responseMimeType": "application/json",
                              },
                          }
                      ).encode()
                      req = urllib.request.Request(
                          f"{BASE}/models/{m}:generateContent",
                          data=body,
                          headers={"Content-Type": "application/json", "x-goog-api-key": KEY},
                          method="POST",
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=180) as r:
                              d = json.load(r)
                          parts = (d.get("candidates") or [{}])[0].get("content", {}).get("parts", [])
                          text = "".join(p.get("text", "") for p in parts if not p.get("thought"))
                          if text.strip():
                              return text, m
                          last = f"{m}: respon kosong"
                          break
                      except urllib.error.HTTPError as e:
                          msg = e.read().decode("utf-8", "replace")[:300]
                          last = f"{m}: HTTP {e.code} {msg}"
                          if e.code in (401, 403) or (e.code == 400 and "API key" in msg):
                              raise RuntimeError(last)
                          if e.code == 429 or e.code >= 500:
                              time.sleep(6 * (attempt + 1))
                              continue
                          break
                      except Exception as e:  # jaringan/timeout
                          last = f"{m}: {e}"
                          time.sleep(3)
                  say(f"⚠️ Model {m} gagal, coba fallback… ({last})")
              raise RuntimeError(last or "Gemini gagal")


          def parse_json(text):
              t = text.strip()
              t = re.sub(r"^```(?:json)?\s*|\s*```$", "", t)
              try:
                  return json.loads(t)
              except Exception:
                  m = re.search(r"\{[\s\S]*\}", t)
                  if m:
                      return json.loads(m.group(0))
                  raise


          # ─── 3. TERAPKAN PATCH ──────────────────────────────────────────────────────
          def apply_fixes(fixes):
              applied, failed = [], []
              for fx in fixes:
                  rel = str(fx.get("path", "")).strip().lstrip("/")
                  full = os.path.realpath(os.path.join(ROOT, rel))
                  norm = full.replace("\\", "/")
                  if (
                      not full.startswith(ROOT + os.sep)
                      or not full.endswith(ALLOWED_EXT)
                      or any(b in norm + "/" for b in BLOCKED_PARTS)
                      or full.endswith(".g.dart")
                  ):
                      failed.append(f"{rel}: path tidak diizinkan")
                      continue
                  act = fx.get("action", "replace")
                  if act == "write":
                      content = fx.get("content")
                      if not isinstance(content, str) or not content.strip():
                          failed.append(f"{rel}: content kosong")
                          continue
                      if os.path.isfile(full) and len(content) < 0.5 * len(read(full)):
                          failed.append(f"{rel}: write ditolak (isi baru <50% dari file lama)")
                          continue
                      os.makedirs(os.path.dirname(full), exist_ok=True)
                      write(full, content)
                      applied.append(rel)
                  elif act == "replace":
                      if not os.path.isfile(full):
                          failed.append(f"{rel}: file tidak ada")
                          continue
                      src = read(full)
                      find, rep = fx.get("find"), fx.get("replace", "")
                      if not isinstance(find, str) or not find or not isinstance(rep, str):
                          failed.append(f"{rel}: find/replace tidak valid")
                          continue
                      n = src.count(find)
                      if n == 0 and find.strip() and src.count(find.strip()) >= 1:
                          find, rep, n = find.strip(), rep.strip(), src.count(find.strip())
                      if n == 0:
                          failed.append(f"{rel}: teks 'find' tidak ditemukan")
                      elif n > 1 and not fx.get("all"):
                          failed.append(f"{rel}: teks 'find' ambigu ({n}x)")
                      else:
                          write(full, src.replace(find, rep))
                          applied.append(rel)
                  else:
                      failed.append(f"{rel}: action '{act}' tidak didukung")
                      continue
                  if rel == "pubspec.yaml" and rel in applied:
                      mark_pub_get()
                      if os.path.isfile("pubspec.lock"):
                          os.remove("pubspec.lock")
              return applied, failed


          # ─── MAIN ───────────────────────────────────────────────────────────────────
          def main():
              log = clean_log(read(LOG))
              st = load_state()

              done = rule_fixes(log, st)
              if done:
                  save_state(st)
                  say("🔧 Perbaikan otomatis (aturan): " + "; ".join(done))
                  summary(f"### 🔧 Auto-fix #{ATTEMPT} (aturan)\n" + "\n".join(f"- {d}" for d in done))
                  return 0

              if not ENABLED:
                  say("ℹ️ Gemini nonaktif / API key kosong — tidak ada perbaikan otomatis lain.")
                  return 1

              history = st.get("history", [])
              hist_txt = ""
              if history:
                  hist_txt = "\n\nRIWAYAT PERBAIKAN YANG SUDAH DICOBA (error masih muncul, jangan diulang):\n" + "\n".join(
                      f"- #{h['attempt']}: {h['analysis']} | file: {', '.join(h['files']) or '-'}"
                      + (f" | gagal: {'; '.join(h['failed'])}" if h.get("failed") else "")
                      for h in history[-5:]
                  )

              prompt = (
                  f"Percobaan perbaikan ke-{ATTEMPT}.\n\n=== LOG ERROR (disaring) ===\n{err_excerpt(log)}\n\n"
                  f"=== ISI FILE ===\n{collect_context(log)}{hist_txt}"
              )
              say(f"🤖 Mengirim analisis ke Gemini ({MODEL}) …")
              try:
                  text, used = gemini(prompt)
                  data = parse_json(text)
              except Exception as e:
                  say(f"❌ Gemini gagal: {e}")
                  summary(f"### ❌ Auto-fix #{ATTEMPT}: Gemini gagal\n`{e}`")
                  return 1

              analysis = str(data.get("analysis", "")).strip() or "(tanpa analisis)"
              fixes = [f for f in (data.get("fixes") or []) if isinstance(f, dict)]
              say(f"🧠 Analisis ({used}): {analysis}")

              sig = hashlib.sha1(json.dumps(fixes, sort_keys=True).encode()).hexdigest()
              if fixes and sig in st.get("hashes", []):
                  say("⚠️ Gemini mengusulkan perbaikan yang sama dengan sebelumnya — dihentikan agar tidak looping.")
                  return 1
              if not fixes:
                  summary(f"### 🤖 Auto-fix #{ATTEMPT}\n{analysis}\n\nGemini tidak memberi perbaikan.")
                  return 1

              applied, failed = apply_fixes(fixes)
              for f in applied:
                  say(f"  ✅ diubah: {f}")
              for f in failed:
                  say(f"  ⚠️ dilewati: {f}")
              st.setdefault("hashes", []).append(sig)
              history.append({"attempt": ATTEMPT, "analysis": analysis, "files": applied, "failed": failed})
              st["history"] = history
              save_state(st)

              summary(
                  f"### 🤖 Auto-fix #{ATTEMPT} ({used})\n{analysis}\n\n"
                  + "\n".join(f"- ✅ `{f}`" for f in applied)
                  + ("\n" + "\n".join(f"- ⚠️ {f}" for f in failed) if failed else "")
              )
              return 0 if applied else 1


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python3 -m py_compile /tmp/gemini_fix.py

      - name: Download & extract source ZIP dari bot
        if: steps.parse.outputs.mode == 'zip'
        run: |
          curl -L "${{ steps.parse.outputs.url }}" -o source.zip
          mkdir -p project
          unzip -q source.zip -d project

      - name: Cari folder project Flutter (jaga-jaga kalau ke-nested di subfolder)
        if: steps.parse.outputs.mode == 'zip'
        id: findproj
        run: |
          PUBSPEC=$(find project -maxdepth 4 -iname "pubspec.yaml" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml gak ketemu di dalam ZIP — pastiin yang di-zip itu ROOT folder project Flutter (bukan folder di dalemnya lagi)."
            exit 1
          fi
          PROJDIR=$(dirname "$PUBSPEC")
          echo "dir=$PROJDIR" >> "$GITHUB_OUTPUT"

      - name: Ganti SEMUA icon FontAwesome ke icon Flutter bawaan
        # PENTING: font_awesome_flutter versi 11.x (otomatis kepasang abis
        # step "lepas batasan versi" narik versi terbaru) ngenalin tipe BARU
        # "FaIconData" (beda dari "IconData" bawaan Flutter) — bikin kode
        # yang nulis widget custom dengan parameter "IconData icon" jadi gak
        # kompatibel lagi sama "FontAwesomeIcons.xxx". Daripada coba nyocokin
        # ulang versi/tipe (beresiko rusak di project lain yang strukturnya
        # beda), SEMUA referensi FontAwesomeIcons.xxx diganti jadi icon
        # Flutter bawaan (Icons.help_outline — dijamin selalu ada & tipenya
        # IconData biasa), FaIcon() diganti jadi Icon() biasa, dan import-nya
        # dihapus.
        #
        # CATATAN PENTING (bug yang udah dibenerin): regex-nya pake `\s*` di
        # antara "FontAwesomeIcons", ".", dan nama icon-nya — BUKAN cuma
        # "FontAwesomeIcons\.\w+" tanpa spasi. Soalnya beberapa project nulis
        # kodenya kepisah baris, misal:
        #   FontAwesomeIcons
        #       .whatsapp,
        # Regex versi lama (tanpa \s*) GAK NANGKEP pola ini — importnya
        # kehapus tapi teks "FontAwesomeIcons"-nya sendiri gak ke-ganti, jadi
        # malah bikin error baru ("getter FontAwesomeIcons isn't defined").
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          python3 << PYEOF
          import re, glob

          dart_files = glob.glob("lib/**/*.dart", recursive=True)
          total_changed = 0
          for path in dart_files:
              with open(path, encoding="utf-8") as f:
                  content = f.read()
              original = content
              content = re.sub(r'FontAwesomeIcons\s*\.\s*\w+', 'Icons.help_outline', content)
              content = re.sub(r'\bFaIcon\(', 'Icon(', content)
              content = re.sub(r"^\s*import\s+['\"]package:font_awesome_flutter/font_awesome_flutter\.dart['\"];\s*\n", '', content, flags=re.M)
              if content != original:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  total_changed += 1

          print(f"✅ Icon FontAwesome diganti di {total_changed} file")
          PYEOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Upgrade Gradle wrapper ke versi TERBARU (otomatis, gak perlu update manual)
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          GWP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GWP" ]; then
            echo "=== distributionUrl SEBELUM ==="
            grep "distributionUrl" "$GWP" || echo "(gak ketemu baris distributionUrl)"

            # PENTING: Gradle DAN AGP (step berikutnya) SENGAJA di-cap di
            # versi 8.x DUA-DUANYA — bukan cuma AGP doang. AGP 8.x internally
            # makai beberapa API Gradle yang DIHAPUS di Gradle 9.0, jadi
            # kalau Gradle-nya dipaksa ke 9.x tapi AGP masih 8.x, build tetep
            # gagal. Solusinya: DUA-DUANYA ditahan di generasi 8.x yang
            # SALING KOMPATIBEL.
            LATEST_GRADLE=$(curl -s https://services.gradle.org/versions/all \
              | jq -r '.[] | select(.snapshot==false and .nightly==false and .releaseNightly==false and .activeRc==false and (.version | test("^8\\.[0-9]+(\\.[0-9]+)?$"))) | .version' \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -1)
            if [ -z "$LATEST_GRADLE" ] || [ "$LATEST_GRADLE" == "null" ]; then
              echo "::error::Gagal ambil versi Gradle 8.x terbaru dari services.gradle.org — cek koneksi/API-nya."
              exit 1
            fi
            echo "Gradle 8.x versi terbaru: $LATEST_GRADLE"

            grep -v "^distributionUrl=" "$GWP" > /tmp/gwp.tmp
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-${LATEST_GRADLE}-all.zip" >> /tmp/gwp.tmp
            mv /tmp/gwp.tmp "$GWP"

            echo "=== distributionUrl SESUDAH ==="
            grep "distributionUrl" "$GWP"
          else
            echo "::warning::File $GWP gak ketemu — kemungkinan project ini gak punya folder android/ standar. Skip upgrade Gradle."
          fi

      - name: Upgrade Android Gradle Plugin (AGP) & Kotlin ke versi TERBARU (otomatis)
        # SATU PAKET sama step upgrade Gradle di atas — Flutter nentuin batas
        # minimum GRADLE, AGP, DAN KOTLIN secara terpisah-pisah. Ambil versi
        # terbaru langsung dari Google Maven (AGP) & Maven Central (Kotlin) —
        # tapi DUA-DUANYA DICAP biar gak kebablasan ke major version yang
        # ngubah default DSL (AGP 9.0+ bikin gaya "android { }" lama jadi
        # error, Kotlin versi abis 2.2.x bikin "kotlinOptions { jvmTarget =
        # ... }" jadi error). Dicap ke seri PALING BARU yang masih 1 generasi
        # sama minimum yang diminta Flutter, bukan mutlak "paling baru ada".
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.findproj.outputs.dir }}/android
        run: |
          LATEST_AGP=$(curl -s https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            | grep -oP '(?<=<version>)[^<]+' \
            | grep -E '^8\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)
          if [ -z "$LATEST_AGP" ]; then
            echo "::error::Gagal ambil versi AGP 8.x terbaru dari Google Maven — cek koneksi/API-nya."
            exit 1
          fi
          echo "AGP 8.x versi terbaru: $LATEST_AGP"

          KOTLIN_MIN_SERIES="2.2"
          LATEST_KOTLIN=$(curl -s https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml \
            | grep -oP '(?<=<version>)[^<]+' \
            | grep -E "^${KOTLIN_MIN_SERIES}\.[0-9]+$" \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)
          if [ -z "$LATEST_KOTLIN" ]; then
            echo "::error::Gagal ambil versi Kotlin ${KOTLIN_MIN_SERIES}.x terbaru dari Maven Central — cek koneksi/API-nya."
            exit 1
          fi
          echo "Kotlin ${KOTLIN_MIN_SERIES}.x versi terbaru: $LATEST_KOTLIN"

          python3 << PYEOF
          import re, glob

          latest_agp = "$LATEST_AGP"
          latest_kotlin = "$LATEST_KOTLIN"
          candidates = glob.glob("settings.gradle*") + glob.glob("build.gradle*") + glob.glob("app/build.gradle*")
          patterns = [
              (r'(id\(["\']com\.android\.application["\']\)\s+version\s+["\'])[\d.]+(["\'])', rf'\g<1>{latest_agp}\g<2>'),
              (r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[\d.]+(["\'])', rf'\g<1>{latest_agp}\g<2>'),
              (r'(classpath\(["\']com\.android\.tools\.build:gradle:)[\d.]+(["\']\))', rf'\g<1>{latest_agp}\g<2>'),
              (r'(classpath\s+["\']com\.android\.tools\.build:gradle:)[\d.]+(["\'])', rf'\g<1>{latest_agp}\g<2>'),
              (r'(id\(["\']org\.jetbrains\.kotlin\.android["\']\)\s+version\s+["\'])[\d.]+(["\'])', rf'\g<1>{latest_kotlin}\g<2>'),
              (r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[\d.]+(["\'])', rf'\g<1>{latest_kotlin}\g<2>'),
              (r'(ext\.kotlin_version\s*=\s*["\'])[\d.]+(["\'])', rf'\g<1>{latest_kotlin}\g<2>'),
              (r'(kotlin\(["\']android["\']\)\s+version\s+["\'])[\d.]+(["\'])', rf'\g<1>{latest_kotlin}\g<2>'),
          ]

          changed_any = False
          for path in candidates:
              with open(path, "r") as f:
                  content = f.read()
              original = content
              for pat, repl in patterns:
                  content = re.sub(pat, repl, content)
              if content != original:
                  with open(path, "w") as f:
                      f.write(content)
                  print(f"✅ AGP/Kotlin di-upgrade di: {path}")
                  changed_any = True

          if not changed_any:
              print("⚠️ Gak ketemu baris versi AGP/Kotlin di file manapun — mungkin project pake struktur beda, skip (build lanjut apa adanya).")
          PYEOF

      - name: Lepas SEMUA batasan versi package di pubspec.yaml
        # Daripada nyusul satu-satu tiap ada package yang ketinggalan, di
        # sini LANGSUNG dilepas SEMUA batasan versi di pubspec.yaml (^X.Y.Z
        # / ">=X.Y.Z <A.B.C" / dll diganti jadi "any") — biar `pub get` BEBAS
        # milih versi PALING BARU & PALING KOMPATIBEL buat SEMUA package.
        # DIBIARIN APA ADANYA: "sdk: flutter", dependency git/path, dan
        # baris "sdk:" di section environment:.
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          python3 << PYEOF
          import re

          path = "pubspec.yaml"
          with open(path) as f:
              lines = f.readlines()

          version_pattern = re.compile(
              r'^(\s{2,4})([a-zA-Z0-9_]+):\s*[\'"]?([\^]?[><=]*\s*\d+\.\d+\.\d+[^\'"\n]*)[\'"]?\s*$'
          )
          skip_keys = {"sdk", "flutter"}

          changed = 0
          out_lines = []
          in_environment = False
          for line in lines:
              stripped = line.rstrip("\n")
              if stripped.strip() == "environment:":
                  in_environment = True
                  out_lines.append(line)
                  continue
              if stripped and not stripped.startswith(" ") and stripped.strip() != "environment:":
                  in_environment = False

              m = version_pattern.match(stripped)
              if m and not in_environment:
                  indent, key, _ = m.groups()
                  if key in skip_keys:
                      out_lines.append(line)
                      continue
                  out_lines.append(f"{indent}{key}: any\n")
                  changed += 1
              else:
                  out_lines.append(line)

          with open(path, "w") as f:
              f.writelines(out_lines)

          print(f"✅ {changed} batasan versi package dilepas jadi 'any'")
          PYEOF

      - name: Hapus pubspec.lock lama & resolve dependency FRESH
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: rm -f pubspec.lock

      - name: Flutter pub get (fresh resolve, auto-fix kalau konflik versi)
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          set +e
          N=0
          while true; do
            flutter pub get 2>&1 | tee /tmp/pubget.log
            RC=${PIPESTATUS[0]}
            [ "$RC" -eq 0 ] && break
            N=$((N+1))
            if [ "$N" -gt 3 ]; then echo "::error::pub get gagal setelah $((N-1)) percobaan auto-fix."; exit "$RC"; fi
            echo "::group::🤖 Auto-fix pub get #$N"
            python3 /tmp/gemini_fix.py /tmp/pubget.log "$N"
            FRC=$?
            echo "::endgroup::"
            if [ "$FRC" -ne 0 ]; then echo "::error::Tidak ada perbaikan baru untuk pub get."; exit "$RC"; fi
            rm -f /tmp/need_pub_get pubspec.lock
          done
          # state riwayat dipisah dari fase build
          rm -f /tmp/fix_state.json

      - name: Upgrade SEMUA package termasuk major version (jaring pengaman tambahan)
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: flutter pub upgrade --major-versions || true

      - name: Patch kode Dart yang gak kompatibel sama versi package/Flutter terbaru
        # Dua error di log GitHub Actions kamu murni dari SOURCE CODE, bukan dari
        # setup build:
        #  1) "Member not found: 'visible'" -> Clip.visible GAK ADA di Flutter.
        #     Enum Clip isinya cuma none/hardEdge/antiAlias/antiAliasWithSaveLayer.
        #     Padanan "overflow kelihatan" = Clip.none.
        #  2) "Member not found: 'platform'" -> file_picker 11+ ngapus
        #     FilePicker.platform.xxx, diganti static FilePicker.xxx. Step
        #     "lepas batasan versi" bikin pub narik versi terbaru, jadi kode lama
        #     harus dimigrasi. Cuma dijalankan kalau versi hasil resolve >= 11.
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          python3 << 'PYEOF'
          import re, glob

          fp_major = 0
          try:
              lock = open("pubspec.lock", encoding="utf-8").read()
              m = re.search(r'^  file_picker:\n(?:    .*\n)*?    version: "(\d+)\.', lock, re.M)
              if m:
                  fp_major = int(m.group(1))
          except FileNotFoundError:
              pass
          print(f"file_picker major version terdeteksi: {fp_major or '(gak dipakai)'}")

          n_clip = n_fp = 0
          for path in glob.glob("lib/**/*.dart", recursive=True):
              with open(path, encoding="utf-8") as f:
                  src = f.read()
              out = re.sub(r'\bClip\s*\.\s*visible\b', 'Clip.none', src)
              if out != src:
                  n_clip += 1
              if fp_major >= 11:
                  out2 = re.sub(r'\bFilePicker\s*\.\s*platform\s*\.\s*', 'FilePicker.', out)
                  if out2 != out:
                      n_fp += 1
                  out = out2
              if out != src:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(out)

          print(f"✅ Clip.visible -> Clip.none di {n_clip} file")
          print(f"✅ FilePicker.platform.* -> FilePicker.* di {n_fp} file")
          PYEOF

      - name: Patch API package yang sudah dihapus (deteksi otomatis dari kode package terpasang)
        # Daripada hardcode per-versi, di sini dicek langsung: kalau kode
        # package file_picker yang TERPASANG sudah tidak punya parameter
        # "withData", semua argumen `withData: ...` di kode app dihapus.
        # (Error "No named parameter with the name 'withData'".)
        # Sisa kasus lain ditangani auto-fix Gemini di step Build.
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, glob

          def pkg_dir(name):
              try:
                  cfg = json.load(open(".dart_tool/package_config.json", encoding="utf-8"))
              except Exception:
                  return None
              for p in cfg.get("packages", []):
                  if p.get("name") == name:
                      uri = p["rootUri"]
                      if uri.startswith("file://"):
                          return uri[7:]
                      return os.path.normpath(os.path.join(".dart_tool", uri))
              return None

          d = pkg_dir("file_picker")
          if not d:
              print("file_picker tidak dipakai — skip")
          else:
              blob = ""
              for f in glob.glob(os.path.join(d, "lib", "**", "*.dart"), recursive=True):
                  blob += open(f, encoding="utf-8", errors="ignore").read()
              if "withData" in blob:
                  print("file_picker masih punya withData — tidak perlu patch")
              else:
                  n = 0
                  for path in glob.glob("lib/**/*.dart", recursive=True):
                      s = open(path, encoding="utf-8").read()
                      o = re.sub(r"\bwithData\s*:\s*[^,)\n]+\s*,?", "", s)
                      if o != s:
                          open(path, "w", encoding="utf-8").write(o)
                          n += 1
                  print(f"✅ argumen withData dihapus di {n} file")
          PYEOF

      - name: Build APK (auto-fix Gemini kalau gagal)
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: |
          # "--android-skip-build-dependency-validation" = flag RESMI Flutter,
          # jaring pengaman untuk pengecekan versi minimum Gradle/AGP/Kotlin.
          if [ "${{ steps.parse.outputs.build_type }}" == "debug" ]; then
            MODE_FLAG="--debug"
          else
            MODE_FLAG="--release"
          fi

          # Loop: build -> kalau gagal, analisis log (aturan + Gemini) -> patch -> build ulang.
          # Berhenti kalau sukses, kena batas MAX_FIX, atau tidak ada perbaikan baru.
          MAX=${MAX_FIX:-6}
          ATTEMPT=0
          rm -f /tmp/fix_state.json
          set +e
          while true; do
            flutter build apk $MODE_FLAG --android-skip-build-dependency-validation 2>&1 | tee /tmp/build.log
            STATUS=${PIPESTATUS[0]}
            if [ "$STATUS" -eq 0 ]; then
              [ "$ATTEMPT" -gt 0 ] && echo "✅ Build sukses setelah $ATTEMPT kali auto-fix."
              break
            fi
            ATTEMPT=$((ATTEMPT+1))
            if [ "$ATTEMPT" -gt "$MAX" ]; then
              echo "::error::Build masih gagal setelah $MAX percobaan auto-fix."
              exit "$STATUS"
            fi
            echo "::group::🤖 Auto-fix percobaan $ATTEMPT/$MAX"
            python3 /tmp/gemini_fix.py /tmp/build.log "$ATTEMPT"
            FRC=$?
            echo "::endgroup::"
            if [ "$FRC" -ne 0 ]; then
              echo "::error::Tidak ada perbaikan baru yang bisa diterapkan — build dihentikan."
              exit "$STATUS"
            fi
            if [ -f /tmp/need_pub_get ]; then
              rm -f /tmp/need_pub_get
              flutter pub get
            fi
          done

      - name: Upload APK sebagai artifact (dibaca balik sama bot)
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ steps.findproj.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
          if-no-files-found: error
